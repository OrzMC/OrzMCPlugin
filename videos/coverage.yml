# 功能点 ↔ 视频 双向映射（影响检测的唯一依据）
#
# 系列已简化为「2 条旗舰视频 + 按需短视频库」（见 videos/series.md）：
#   V1 = 宣传短片（吸引）  V2 = 快速上手（教会）  B1 = 群指令总览（短视频库·已备源，不排产）
#
# 用途：`videos/tools/affected-episodes.py --base origin/main` 依 PR 变更判定「哪个视频受影响、怎么更新」。
# 维护义务：V1/V2/B1 覆盖到的功能/命令/配置键/模板键变更时同步登记；未登记 = 「无视频覆盖」，工具仅非阻塞提示。
# 等级：L1 仅文案（换字幕不重录）· L2 交互/界面变（单镜重录 + 重合成）· L3 新增/退役（加片或归档）

version: 1

# 视频清单（produced=true 表示源已落地；成片状态见 status.md）
episodes:
  V1: {id: ep00, slug: promo,        title: 宣传短片,   cap_s: 90,  produced: true}
  V2: {id: ep25, slug: quickstart,   title: 快速上手,   cap_s: 180, produced: false}
  B1: {id: ep01, slug: bot-commands, title: 群指令总览, cap_s: 150, produced: true}

# 变更文件 → 判定方式
sources:
  docs/features.md: {mode: chapters}
  src/main/resources/config.yml: {mode: config_keys}
  src/main/resources/templates.yml: {mode: template_keys}
  src/main/java/com/jokerhub/paper/plugin/orzmc/features/botcommands/: {mode: literal, episodes: [B1, V2], level: L2, note: Bot 命令实现}
  src/main/java/com/jokerhub/paper/plugin/orzmc/features/rank/: {mode: literal, episodes: [V1], level: L2, note: 权限晋升（宣传卖点）}
  src/main/java/com/jokerhub/paper/plugin/orzmc/features/review/: {mode: literal, episodes: [V1], level: L2, note: 审核闭环（宣传卖点）}
  src/main/java/com/jokerhub/paper/plugin/orzmc/features/security/: {mode: literal, episodes: [V1], level: L2, note: 安全兜底（宣传卖点）}
  src/main/java/com/jokerhub/paper/plugin/orzmc/features/whitelist/: {mode: literal, episodes: [V2], level: L2, note: 白名单（快速上手）}
  src/main/java/com/jokerhub/paper/plugin/orzmc/features/maintenance/: {mode: literal, episodes: [V1], level: L2, note: 备份兜底（宣传卖点）}
  videos/episodes/: {mode: ignore}

# features.md 章节 → 视频（只登记有视频覆盖的章节；其余章节改动 = 无视频覆盖，工具仅提示）
chapters:
  "§1":  [V1, V2]       # 白名单：V1 镜2 演示、V2 上手 $a
  "§2":  [B1, V1, V2]   # Bot/群聊：命令总览 + 宣传 + 上手
  "§5":  [V1]           # 安全（宣传卖点）
  "§7":  [V1]           # 备份（宣传卖点）
  "§15": [V1]           # 权限晋升审核（宣传卖点）

# Bot 命令 → 视频（命令语义/参数变更时命中）
commands:
  "$l": [B1, V1]
  "$w": [B1]
  "$h": [B1, V2]
  "$a": [B1, V1, V2]
  "$r": [B1, V1]
  "$b": [B1, V1]
  "$o": [B1]
  "$e": [B1]
  "$v": [B1, V1]
  "$p": [B1]
  "$d": [B1]

# config.yml 键 → 视频（只登记有视频覆盖的键）
config_keys:
  "whitelist": [V1, V2]
  "bot": [B1, V2]
  "command_policies": [B1]
  "tnt": [V1]
  "player_notify": [B1]
  "maintenance": [V1]

# templates.yml 键 → 视频（文案类 → L1；`templates.*` 是整段删除时的兜底）
template_keys:
  "templates.*": [B1, V1, V2]
  "templates.command_help": [B1, V2]
  "templates.command_players": [B1, V1]
  "templates.command_whitelist_header": [B1, V1, V2]
  "templates.command_whitelist_page": [B1, V1, V2]
  "templates.command_whitelist_add_result": [B1, V1, V2]
  "templates.command_whitelist_remove_result": [B1, V1, V2]
  "templates.maintenance_motd_backup": [V1]
  "templates.maintenance_motd_optimize": [V1]
  "templates.maintenance_backup_done": [V1]
