# templates.yml 键 → 集号（文案类 → L1）
# 说明：具体键按名映射；`templates.*` 是兜底（diff 为纯删除/结构变化、无法定位具体键时命中画面中会出现
#      消息文案的集），命中后只需替换字幕，不必重录。
template_keys:
  "templates.*": [EP1, EP5, EP20]
  "templates.command_help": [EP1]
  "templates.command_players": [EP1, EP3]
  "templates.command_whitelist_header": [EP3]
  "templates.command_whitelist_page": [EP3]
  "templates.command_whitelist_add_result": [EP3]
  "templates.command_whitelist_remove_result": [EP3]
  "templates.command_blacklist_list": [EP12]
  "templates.command_blacklist_add": [EP12]
  "templates.command_blacklist_remove": [EP12]
  "templates.maintenance_motd_backup": [EP20]
  "templates.maintenance_motd_optimize": [EP21]
  "templates.maintenance_backup_done": [EP20]
