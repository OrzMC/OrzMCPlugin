# Codecov 覆盖率配置
# 文档: https://docs.codecov.com/docs/codecovyml-reference
coverage:
  range: 50..80
  round: down
  precision: 1
  status:
    project:
      default:
        # 注意口径差异：Codecov 的 coverage = hits / (hits+misses+partials)，**部分覆盖行(details)算未覆盖**；
        # JaCoCo 把部分覆盖行算已覆盖。同一份报告：JaCoCo LINE 81.2%，Codecov 72.0%
        # （实测 2026-11-14：hits 10376 / misses 2717 / partials 1311 → 72.03%）。
        # 因此 Codecov 目标按它自己的口径定，硬门禁仍以仓库内 JaCoCo 为准（78/65/78）。
        target: 70%
        threshold: 2%
        flags:
          - unittests
          - integrationtests
    patch:
      default:
        # 新增/改动行的覆盖率门槛：防「新代码零测试」稀释整体覆盖
        # （Codecov 状态检查为必需项时才会阻断合并；JaCoCo 是仓库内的硬门禁）
        target: 70%
        threshold: 5%

flags:
  unittests:
    paths:
      - src/main/java/
    carryforward: true
  integrationtests:
    paths:
      - src/integrationTest/java/
    carryforward: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

github_checks:
  annotations: true
