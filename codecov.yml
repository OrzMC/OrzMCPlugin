# Codecov 覆盖率配置
# 文档: https://docs.codecov.com/docs/codecovyml-reference
coverage:
  range: 50..80
  round: down
  precision: 1
  status:
    project:
      default:
        # 实测基线 81.9%（INSTRUCTION）；门槛贴实际值，防止「整体缓慢下滑」
        target: 78%
        threshold: 2%
        flags:
          - unittests
          - integrationtests
    patch:
      default:
        # 新增/改动行的覆盖率门槛：防「新代码零测试」稀释整体覆盖
        # （Codecov 状态检查为必需项时才会阻断合并；JaCoCo 是仓库内的硬门禁）
        target: 70%
        threshold: 5%

flags:
  unittests:
    paths:
      - src/main/java/
    carryforward: true
  integrationtests:
    paths:
      - src/integrationTest/java/
    carryforward: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

github_checks:
  annotations: true
