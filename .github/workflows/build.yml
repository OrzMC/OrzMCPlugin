name: Pull Request Build Check
on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    # id-token 仅本 job 需要：Codecov 走 GitHub OIDC 联邦鉴权（无需 CODECOV_TOKEN 密钥）
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v6.4.1

      - name: jdk
        uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: 25

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: true

      - name: spotless check
        run: ./gradlew spotlessCheck --stacktrace

      - name: 明文密钥扫描（防私钥/凭据入库，2026-09 事故后门禁）
        run: ./gradlew checkSecrets --stacktrace

      - name: unit tests
        run: ./gradlew test --stacktrace

      - name: integration tests
        run: ./gradlew integrationTest --stacktrace

      - name: coverage verification
        run: ./gradlew jacocoTestReport jacocoTestCoverageVerification --stacktrace

      - name: build shadowJar
        run: ./gradlew shadowJar --stacktrace

      - name: upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.sha }}
          path: build/reports/jacoco/
          if-no-files-found: warn

      - name: upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          # OIDC：Codecov GitHub App 已安装到本仓库，无需长期 token（也不会因密钥过期/泄漏失效）
          use_oidc: true
          files: build/reports/jacoco/test/jacocoTestReport.xml
          # jacocoTestReport 合并了 test + integrationTest 两个 exec，覆盖两种 flag 的 paths
          flags: unittests,integrationtests
          # 上传失败即红：覆盖率数据缺失时不能"看起来绿"（上游故障时重跑或临时回退本行）
          fail_ci_if_error: true
          verbose: true

      - name: generate build summary
        if: github.event_name == 'pull_request'
        run: |
          echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **BuildID:** $GITHUB_RUN_ID" >> $GITHUB_STEP_SUMMARY
          echo "- **CommitID:** ${GITHUB_SHA:0:10}" >> $GITHUB_STEP_SUMMARY
          echo "- **PR:** #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** ${{ github.event.pull_request.user.login }}" >> $GITHUB_STEP_SUMMARY

      - name: upload jar artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: orzmc-plugin-${{ github.event.pull_request.head.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: post PR comment
        uses: actions/github-script@v9
        continue-on-error: true
        if: success() && github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- orzmc-build-summary -->';
            const fullSha = context.payload.pull_request.head.sha;
            const shortSha = fullSha.substring(0, 10);
            const artifactName = 'orzmc-plugin-' + fullSha;
            const base = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo;
            const runUrl = base + '/actions/runs/' + context.runId;
            const commitUrl = base + '/commit/' + fullSha;
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              name: artifactName
            });
            const artifactId = artifacts.artifacts[0].id;
            const downloadUrl = base + '/actions/runs/' + context.runId + '/artifacts/' + artifactId;
            const now = new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' });
            const body = marker + '\n## ✅ Build Passed  (' + now + ')' +
              '\n| 项目 | 详情 |' +
              '\n|------|------|' +
              '\n| **BuildID** | [' + context.runId + '](' + runUrl + ') |' +
              '\n| **CommitID** | [' + shortSha + '](' + commitUrl + ') |' +
              '\n| **Artifact** | [' + artifactName + '.zip](' + downloadUrl + ') |' +
              '\n| **Author** | @' + context.payload.pull_request.user.login + ' |';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # 真实 Folia 冒烟（D8）：foliaSmoke 任务下载 Folia jar（Fill API v3 + SHA256 校验）→
  # 无头启动 → 校验 OrzMC 加载 → stop → 断言干净退出。
  # 独立 job 不拖慢主构建；2026-08-19 起转为必须门禁（失败阻断 PR）。
  # 说明：MockBukkit 单线程模型测不出 region 隔离竞态，此 job 是「插件在 Folia 启动即崩溃」
  # 这类回归的唯一兜底。
  folia-smoke:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v6.4.1

      - name: jdk
        uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: 25

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: true

      - name: folia smoke
        run: ./gradlew foliaSmoke --stacktrace

      - name: folia smoke (builtin backend, QQ no creds → D3 stop-group boot path)
        run: ./gradlew foliaSmoke -PfoliaImBackend=builtin --stacktrace

  # 真实 Paper 自举 E2E（L1.5）：下载 Paper → 隔离 run 目录起服 → 5 条 Bot 命令链路控制台断言 → 干净退出。
  # 与 folia-smoke 并行（不拖慢主构建），覆盖 Paper 侧命令注册/分页/代执行控制台命令——MockBukkit 测不到的部分。
  # 不依赖常驻测试服或面板 API：全部在 runner 内自举。
  e2e-paper:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v6.4.1

      - name: jdk
        uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: 25

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: true

      - name: e2e (paper, self-hosted server + console assertions)
        run: ./gradlew e2eLocalPaper --stacktrace

  # 真实 Folia + 真实 LuckPerms（L1.5+）：下载 LP 5.5.x → 起服 → 13 条断言（含 $p 权限链、/rank 拦截器链）。
  # 为什么单列：LP 的异步 future + Folia region 线程是历史死锁事故区（132s 卡服），
  # MockBukkit 里没有 LP，这条链路此前完全不在 PR 覆盖内。
  e2e-lp:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v6.4.1

      - name: jdk
        uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: 25

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: true

      - name: e2e (folia + luckperms, 13 console assertions)
        run: ./gradlew e2eLocalFoliaLp --stacktrace

  # 自举 builtin IM 全链路（L1.5+）：仓库内假 QQ 平台（HTTP+WS，纯标准库）→ 起服 →
  # 注入群消息 → 断言出站回复。覆盖「token→gateway→WS→入站→会话门槛→命令层→出站」——
  # 这一层此前只能靠真实 QQ 群人工验收（真实频控/被动窗口不可仿造，但协议与业务链路可以）。
  e2e-im:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v6.4.1

      - name: jdk
        uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: 25

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: true

      - name: e2e (builtin QQ + fake platform, full inbound→outbound round trip)
        run: ./gradlew e2eLocalIm --stacktrace

  # 玩家侧自举（L1.5+）：真实 mineflayer 客户端连本机 Paper（ViaVersion + ViaBackwards 兼容 1.21.11 ↔ 26.2）
  # → 双玩家断言：管理员加入/`/menu` GUI/`/guide` 开书；非管理员 `/config` 被拒（权限隔离）。
  # 覆盖此前"必须真人点"的那一层；协议/插件实测见 e2e/ci/player-probe.js 头部注释。
  e2e-player:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v6.4.1

      - name: jdk
        uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: 25

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: true

      - name: "e2e (player: join / menu GUI / guide book / permission isolation)"
        run: ./gradlew e2eLocalPlayer --stacktrace
