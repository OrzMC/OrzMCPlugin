name: Publish
on:
  push:
    # paths-ignore：纯文档/CI/流程变更不发版（beta 应对应验收过的功能集，不为文档噪音发版）
    # 注意：docs/、*.md、.github/、AGENTS.md 类改动 push main 不触发发布；混合改动（含代码）仍发布
    branches:
      - main                # → Dev 发布 (beta channel)
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'CHANGELOG.md'
      - '.github/**'
      - 'e2e/**'
      # tag 后 bump version 的自增 commit 只改版本号（paper-plugin.yml）→ 不应产生 beta 噪音；
      # paths-ignore 语义 = 本次 push 改动全部落在忽略集才不触发——纯 bump push 跳过，混合改动仍发布
      - 'src/main/resources/paper-plugin.yml'
    tags:
      - '*.*.*'             # → Release 发布 (release channel, 纯 SemVer)

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.BOT_PAT }}

      - name: gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v6.3.0

      - name: jdk
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: 25

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      # Tag 发布前先跑完整检查，main push 跳过（PR 已检查）
      - name: check (tag only)
        if: github.ref_type == 'tag'
        run: ./gradlew check --stacktrace

      - name: publish to Hangar
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: |
          # 先构建 shadowJar（快速失败，不消耗 Hangar API 调用）
          ./gradlew shadowJar --stacktrace

          # 发布到 Hangar，含重试逻辑。
          # Hangar 在 Release 通道处理较慢，可能返回 504 Gateway Timeout，
          # 但此时上传往往已成功完成，因此需要重试并处理“版本已存在”的情况。
          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
            echo "::group::Hangar publish attempt ${attempt}/${max_attempts}"
            output=$(./gradlew publishPluginPublicationToHangar --stacktrace 2>&1) && {
              echo "$output"
              echo "::endgroup::"
              echo "✅ Published to Hangar on attempt ${attempt}"
              echo "::group::Sync Hangar page"
              ./gradlew syncPluginPublicationMainResourcePagePageToHangar --stacktrace
              echo "::endgroup::"
              echo "✅ Hangar page synced"
              exit 0
            }
            echo "$output"
            echo "::endgroup::"

            # 如果 Hangar 返回“版本已存在”，说明之前的尝试已成功上传
            if echo "$output" | grep -qi "already exists\|already created\|version.*already\|duplicate"; then
              echo "⚠️  Version appears to already exist on Hangar — treating as success"
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              delay=$((attempt * 20))
              echo "⏳ Attempt ${attempt} failed, retrying in ${delay}s..."
              sleep "$delay"
            fi
          done

          echo "❌ All ${max_attempts} Hangar publish attempts failed"
          exit 1

      - name: publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          # 计算版本号（与 build.gradle.kts 中的 shadowJarVersion 逻辑一致）
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            CURRENT_VERSION=$(sed -n 's/^version: *//p' src/main/resources/paper-plugin.yml)
            VERSION="${CURRENT_VERSION}-dev.${{ github.run_number }}"
          fi
          echo "Target Modrinth version: ${VERSION}"

          # 先查询 Modrinth API，检查是否已存在相同版本号。
          # Modrinth 不保证 version_number 唯一，不主动检查会导致重复上传产生多条记录。
          PROJECT_ID="${MODRINTH_PROJECT_ID:-r8ZufLjY}"
          echo "::group::Check if version ${VERSION} already exists on Modrinth"
          EXISTING=$(curl -s "https://api.modrinth.com/v2/project/${PROJECT_ID}/version?limit=10000" | jq --arg v "$VERSION" '[.[] | select(.version_number == $v)] | length')
          echo "Existing versions with number '${VERSION}': ${EXISTING}"
          echo "::endgroup::"

          if [ "$EXISTING" -gt 0 ]; then
            echo "✅ Version ${VERSION} already exists on Modrinth — skipping upload"
            exit 0
          fi

          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
            echo "::group::Modrinth publish attempt ${attempt}/${max_attempts}"
            output=$(./gradlew modrinth --stacktrace 2>&1) && {
              echo "$output"
              echo "::endgroup::"
              echo "✅ Published to Modrinth on attempt ${attempt}"
              echo "::group::Sync Modrinth body"
              ./gradlew modrinthSyncBody --stacktrace
              echo "::endgroup::"
              echo "✅ Modrinth body synced"
              exit 0
            }
            echo "$output"
            echo "::endgroup::"

            if echo "$output" | grep -qi "already exists\|already.*version\|duplicate"; then
              echo "⚠️  Version appears to already exist on Modrinth — treating as success"
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              delay=$((attempt * 20))
              echo "⏳ Attempt ${attempt} failed, retrying in ${delay}s..."
              sleep "$delay"
            fi
          done

          echo "❌ All ${max_attempts} Modrinth publish attempts failed"
          exit 1

      - name: create GitHub Release
        if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: build/libs/*.jar
          generate_release_notes: true

      - name: bump version
        if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          # 读取当前版本，递增 patch
          CURRENT=$(sed -n 's/^version: *//p' src/main/resources/paper-plugin.yml)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"

          # 写入新版本
          sed -i 's/^version:.*/version: '"$NEW"'/' src/main/resources/paper-plugin.yml

          # 提交到临时分支并以 PR 合入 main
          # main 有分支保护 ruleset（禁直接 push，GH013 remote rejected）——不能 git push HEAD:main。
          # 改走 bump-version/<NEW> 分支 + PR + 原生 auto-merge（BOT_PAT 可 enable，与里程碑同机制）。
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/paper-plugin.yml
          git commit -m "chore: bump version to $NEW"
          BRANCH="bump-version/$NEW"
          # 幂等：同名分支的 PR 已创建过（重跑/手工补 bump）→ open 则复用，merged 则跳过
          open_num="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number // empty')"
          if [ -n "$open_num" ]; then
            echo "ℹ️ 复用已存在的 bump PR #$open_num"
            gh pr merge "$open_num" --auto --squash
            exit 0
          fi
          if [ -n "$(gh pr list --head "$BRANCH" --state merged --json number -q '.[0].number // empty')" ]; then
            echo "✅ bump PR 已合并（版本已推进到 $NEW），跳过重复 bump"
            exit 0
          fi
          # tag 事件下 actions/checkout 处于 detached HEAD：refspec 必须全限定到 refs/heads，
          # 否则 git 无法推断目标（实测报错：The destination you provided is not a full refname）。
          # --force：分支为发布流程专用的临时分支，无关联 PR 时允许覆盖残留分支。
          git push --force origin "HEAD:refs/heads/$BRANCH"
          pr="$(gh pr create --base main --head "$BRANCH" \
                --title "chore: bump version to $NEW" \
                --body "版本号自增 commit（tag 发布流程自动产生：$CURRENT → $NEW）。CI 绿后 auto-merge 合入 main。")"
          gh pr merge "$pr" --auto --squash
          echo "✅ bump PR $pr 已创建并 enable auto-merge（version → $NEW）"
