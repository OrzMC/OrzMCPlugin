# --- bot.*（群指令帮助/用法/示例；P3a 默认语言 R1。名称由 {name}/{prompt} 注入） ---
bot:
  help_title: "🤖 OrzMC 群指令帮助"
  help_intro: "发送「{prompt}x ?」可查看单个指令的用法示例"
  help_admin_section: "👨‍💼 管理员指令"
  help_general_section: "👨🏻‍💻 通用指令"
  admin_required: "{cmd} 需要管理员权限"
  lbl_usage: "📚 用法："
  lbl_example: "🚀 示例："
  desc:
    l: "查看在线玩家"
    w: "查看白名单玩家"
    h: "查看帮助信息"
    a: "添加玩家到白名单"
    r: "从白名单移除玩家"
    b: "地图备份"
    o: "优化地图大小"
    e: "执行控制台命令"
    d: "添加/移除/查看IP黑名单和玩家名规则"
    v: "查看/处理审核申请"
    p: "权限管理（升级/降级）"
  usage:
    a: "🎯 {name} 添加玩家到白名单"
    r: "🎯 {name} 移除白名单玩家"
    e: "🎯 {name} 执行控制台命令"
    d: "🎯 {name} IP/玩家名规则管理"
    v: "🎯 {name} 审核申请"
    p: "🎯 {name} 权限管理"
    l: "🎯 {name} 查看在线玩家"
    w: "🎯 {name} 查看白名单玩家"
    h: "🎯 {name} 查看帮助"
    b: "🎯 {name} 地图备份"
    o: "🎯 {name} 优化地图大小"
  params:
    a: "{name} <玩家> <玩家2> ...（空格或逗号分隔，可批量）"
    r: "{name} <玩家> <玩家2> ...（空格或逗号分隔，可批量）"
    e: "{name} <控制台命令>"
    l: "{name}（无参数，直接执行）"
    w: "{name} [页码]（可选，如 {name} 2）"
    h: "{name}（无参数，直接显示本帮助）"
    b: "{name}（无参数，直接执行备份）"
    o: "{name}（无参数，直接执行优化）"
    v: "{name} l [页码]       查看待审列表\n{name} y <玩家>       通过申请\n{name} n <玩家>       拒绝申请\n（y/n 可写 yes/no；同玩家多类型申请用 {name} y <typeId> <玩家>）"
    p: "{name} u|up <玩家>    权限升级（default→member→builder→admin）\n{name} d|down <玩家>  权限降级（admin→builder→member→default）"
    d: "{name}                查看黑名单\n{name} [IP]           添加黑名单\n{name} -[IP]          移除黑名单\n{name} player <type> <value>   添加玩家名规则\n{name} -player <type> <value>  移除玩家名规则\n{name} player list             查看玩家名规则\n匹配类型 <type>: exact精确 / prefix前缀 / suffix后缀 / contains包含 / glob通配(*?) / regex正则"
  examples:
    a: "{name} Steve\n{name} Steve Alex Bob\n{name} Steve,Alex,Bob"
    r: "{name} Steve\n{name} Steve Alex Bob\n{name} Steve,Alex,Bob"
    e: "{name} plugins\n{name} say 大家好"
    l: "{name}"
    w: "{name}\n{name} 2"
    h: "{name}"
    b: "{name}"
    o: "{name}"
