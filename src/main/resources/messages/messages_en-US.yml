# ==================================================
#          OrzMC Language Pack: English (US)
# ==================================================
#
# 【This file is a TRANSLATION of messages_zh-CN.yml — do not invent keys】
# Key set and {var} placeholders per key MUST match the zh-CN master exactly;
# enforced at startup health check and by I18nCatalogConsistencyTest.
#
# 【Placeholders】Use {var} tokens (same syntax as templates.yml, \n escapes work).
# Missing keys fall back to zh-CN at runtime, so keep this file complete per release.
#
# 【Editing】Server owners may override any message via data-folder
# messages_custom_en-US.yml (empty value "" = suppress the message).
#
# 【Adding a language】Add messages/messages_<code>.yml resource + one line in
# I18nLoader.CODES — no business code changes needed.
#
# Keys were populated per migration PRs P1-P5 (docs/dev/i18n-plan.md §5, ledger §8);
# the file is kept structurally identical to the zh-CN master.
#
# --- common.* (cross-channel generic feedback; migrated with command interceptors, P1) ---
common:
  cooldown: "Command is on cooldown, please try again later."
  admin_required: "Administrator permission required."
  player_required: "This command can only be used by a player."
  prison_denied: "You are imprisoned and cannot use this command."
  unknown_player: "Unknown player"
  copy_coords: "Click to copy coordinates"

# --- teleport.* (teleport bow; migrated with the teleport domain, P2a) ---
teleport:
  bow:
    name: "Teleport Bow"
    tag: "[Teleport Bow]"
    lore: "Teleports you to where the arrow lands."
    given: "You received {name}."
    disabled: "Teleport bow is disabled. Please contact an administrator."
    hit_water: "The arrow landed in water!"
    hit_lava: "The arrow landed in lava!"
    cross_world: "Cannot teleport across worlds!"
    bad_height: "Target height is out of bounds!"
    no_landing: "No safe landing spot at the target location!"
    done: "Teleport complete!"

# --- whitelist.* (login kick hints / group notifications; P2b. Kick is pre-login with no
#     client locale, so it follows the server default language) ---
whitelist:
