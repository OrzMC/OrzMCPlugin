# ==================================================
#              OrzMC 核心配置 (合并)
# ==================================================

# 配置 schema 版本：插件启动时若磁盘版本低于内置版本，会自动补齐缺失默认键并升级
# （原文件备份为 config.yml.bak）。版本号由插件维护，无需手动修改。
config-version: 11

# ==================================================
#             服务器白名单配置
# ==================================================
whitelist:
  force_whitelist: true
  cleanup_inactive_days: 90
  pagination_delay_ticks: 5
  # 白名单踢出消息（当 force_whitelist=true 且玩家不在名单中时显示）
  kick_message:
    title: "可以在这里提示用户关注UP主帐号，进行私域建设"
    ups:
      - platform: 'YouTube'
        name: 'OrzMC'
      - platform: 'BiliBili'
        name: 'OrzMC'

# ==================================================
#             地图优化/备份
# ==================================================
maintenance:
  optimize_enabled: false
  optimize_tick_time_threshold: 300
  backup_retention_count: 5
  # 维护场景文案与进度行已迁移到 templates.yml（maintenance_motd_backup/optimize/manual/
  # maintenance_motd_progress_line，2026-09-02）：MOTD / 登录拦截 / 踢人统一读取模板渲染，
  # 支持占位符 {stage} {percent} {eta}；本段不再含 motd 键。
  # 定时自动备份间隔（小时）：0 = 关闭；>0 表示每 N 小时自动备份一次。
  # 该字段支持 /config reload 热重载：修改后无需重启，下一个检查点（每分钟）即生效。
  backup_interval_hours: 0

# ==================================================
#                   TNT 检查配置
# ==================================================
tnt:
  enable: false
  enable_respawn_anchor: false
  place_cooldown: 5
  # TNT/爆炸告警聚合窗口(ms)：同一区域(128×128×64区块)同类型事件在窗口内合并为一条告警(带 ×N 和首个坐标)；
  # 既是突发合并也限制持续刷屏频率。单发事件仍立即发，不受窗口延迟。
  notify_aggregate_ms: 3000
  # 放行区域列表（空 = 全图禁止 TNT 放置/点燃；条目格式 {minX,maxX,minY,maxY,minZ,maxZ,world}）
  whitelist: []
  # 豁免实体由代码内置兜底（TntEventService.DEFAULT_EXEMPT_ENTITIES 11 项），如需自定义在此填 EntityType 大写名列表

# ==================================================
#                IP 地区白名单
# ==================================================
geoip:
  # 允许访问的地区国家码（空列表 = 不限制）
  # 填写大写两位 ISO 国家码，例如：
  #   allow_country_code: [CN, JP, TW]
  allow_country_code: []
  # GeoIP 查询失败/超时/无法定位国家码时的登录策略（默认 fail-close，安全优先）：
  #   false = fail-close：无法验证地区 → 拒绝进入，防绕过地区白名单
  #   true  = fail-open ：无法验证地区 → 放行并告警管理员，防误拦（可用性优先）
  fail_open: false

# ==================================================
#             玩家上下线通知（2026-08-16）
# ==================================================
player_notify:
  # 各类型通知开关：关闭后该类型事件不再产生群消息
  enabled_join: true
  enabled_quit: true
  enabled_kick: true
  # 聚合窗口(ms)：窗口内所有上下线事件合并为一条消息，限制高频上下线刷屏。
  # 单条事件仍按原模板单发（延迟一个窗口），多条事件渲染 player_digest 摘要。
  # 消息频率被限制为最多 1 条/窗口，事件不丢失（逐条精确计数）。
  window_ms: 1000
  # 聚合摘要最多列出的玩家名数量，超出用 "+等N人" 截断（仅显示截断，计数不受影响）
  max_list_items: 6

# ==================================================
#              实体传送策略（2026-08-09）
# ==================================================
# 实体传送开关：true = 允许命令/插件传送所有实体。
# false = 仅白名单内实体可被命令/插件传送（默认，防 @e 选择器误用把海量实体传送到虚空/岩浆造成地图灾难）。
# 下界传送门穿越（EntityPortalEvent）始终放行，不受此开关影响（掉落物/矿车/船/生物照常过门）。
#   - 白名单项：大写 EntityType 名（如 VILLAGER），或特殊键
#     TAMEABLE / ENDERMAN / ARMOR_STAND / SHULKER
#   - TAMEABLE 按接口判定，已覆盖猫/狗/鹦鹉 + 全部马科（马/驴/骡/羊驼/骆驼），无需重复列出
#   - 白名单默认只含常见被动/友好实体（村民/牲畜/友好水生/傀儡等），敌对生物不在内
entity_teleport_enabled: false
entity_teleport_whitelist:
  - TAMEABLE
  - ENDERMAN
  - ARMOR_STAND
  - SHULKER
  - VILLAGER
  - WANDERING_TRADER
  - COW
  - PIG
  - SHEEP
  - CHICKEN
  - RABBIT
  - GOAT
  - MOOSHROOM
  - AXOLOTL
  - BEE
  - IRON_GOLEM

# ==================================================
#              命令策略
# ==================================================
command_policies:
  tpbow:
    cooldown_secs: 3
    admin_only: false
  menu:
    cooldown_secs: 0
    admin_only: false
  portal:
    cooldown_secs: 5
    admin_only: true

# ==================================================
#             危险命令拦截（安全加固）
# ==================================================
# 高危命令 deny-list：命中即拦截执行并（可选）私信管理员。
# 仅默认拦截非管理员即可造成提权/信息泄露的命令：
#   op      —— 误给 OP / 影子管理员
#   publish —— 绕过 online-mode 认证
#   seed    —— 泄露世界种子
# stop/reload/deop/plugman 属正常服务器运维生命周期命令（停服/重载/管理 OP 与插件），
# 且原生即受 OP 权限限制，故不默认拦截，避免管理员自身无法执行运维操作。
# 如需恢复拦截，自行在下方列表追加即可。
guard:
  # 总开关：关闭后危险命令拦截/审计全部停用
  enabled: true
  # 高危命令 deny-list（小写命令名，支持子命令项，如 plugman reload）
  blocked_commands:
    - op
    - publish
    - seed
  # 拦截时是否私信管理员（PRIVATE 路由）
  notify_admins: true
  # 是否记录命令审计到 audit/command_audit.log
  audit_enabled: true

# ==================================================
#             聊天反垃圾/反广告（安全加固）
# ==================================================
# 在异步聊天事件（AsyncChatEvent）上做三类拦截，命中即丢弃该条消息：
#   max_messages_per_minute —— 60s 滑动窗口内最多发言条数（限流）
#   detect_links            —— 检测并丢弃含链接（http/https/www.）的消息（反广告）
#   detect_repeat           —— 检测并丢弃与本人上一条完全相同的消息（反刷屏）
# 命中任一规则即取消该条聊天并给玩家发送 message 提示。
chat:
  # 总开关：关闭后聊天过滤全部停用
  enabled: true
  # 每分钟最多发言条数（60s 滑动窗口）
  max_messages_per_minute: 20
  # 是否丢弃含链接的消息
  detect_links: true
  # 是否丢弃与上一条完全相同的重复消息
  detect_repeat: true
  # 命中时的提示文案
  message: "请勿刷屏或发送广告"

# ==================================================
#             进服限流/反 bot（安全加固）
# ==================================================
# 在异步登录事件（AsyncPlayerPreLoginEvent）上按 IP 做两类拦截，命中即拒绝进入：
#   max_login_attempts_per_minute —— 60s 滑动窗口内最多登录尝试次数（频率，反 bot 群刷）
#   max_concurrent_per_ip        —— 同 IP 最大在线上限（并发，反多开/alt 农场）
# 命中时按 notify_admins 配置 PRIVATE 私信管理员，并给玩家发送 message 提示。
login_rate_limit:
  # 总开关：关闭后进服限流全部停用
  enabled: true
  # 每分钟最多登录尝试次数（60s 滑动窗口）
  max_login_attempts_per_minute: 20
  # 同 IP 最大在线上限
  max_concurrent_per_ip: 5
  # 命中时是否 PRIVATE 私信管理员
  notify_admins: true
  # 命中时的提示文案
  message: "登录过于频繁，请稍后再试"

# ==================================================
#             已知漏洞加固（安全加固 P2-3）
# ==================================================
# 三类已知利用的插件侧兜底（对应站点文章《PaperMC 开放服务器检查清单》§4）：
#   book_enabled / book_max_pages           —— 书与笔页数上限（防超大书页/大量书崩溃）
#   item_enabled / item_max_attribute_modifiers —— 物品属性修饰符数量上限（防 32k：NBT 叠加超量属性）
#   entity_enabled / entity_max_per_chunk   —— 单区块实体数上限（防卡服机，到达上限后拒绝新的实体生成，
#                                              掉落物/抛射物豁免）
# 命中书页/物品规则时按 notify_admins 配置 PRIVATE 私信管理员，并给玩家发送 message 提示。
exploit_hardening:
  # 总开关：关闭后漏洞加固全部停用
  enabled: true
  # 书与笔：每本最多页数（关闭请用 book_enabled=false）
  book_enabled: true
  book_max_pages: 100
  # 物品：属性修饰符数量上限（关闭请用 item_enabled=false）
  item_enabled: true
  item_max_attribute_modifiers: 6
  # 实体：单区块实体数上限（关闭请用 entity_enabled=false）
  entity_enabled: true
  entity_max_per_chunk: 128
  # 命中书页/物品时是否 PRIVATE 私信管理员（实体拦截静默，防刷屏）
  notify_admins: true
  # 命中时的提示文案
  message: "检测到异常内容，已自动处理"

# ==================================================
#             玩家名颜色（按权限等级，2026-08-21）
# ==================================================
# 三个界面生效：头顶名（计分板队伍颜色）、聊天、Tab 列表。
# 纯颜色区分等级，不加前缀文字。OP 与四级权限独立：是 OP 优先显示 op_color，
# 非 OP 才显示所属等级组颜色（colors）。计分板队伍颜色协议仅 16 个命名色，
# 保证三处一致统一用命名色；也可填 #RRGGBB，自动吸附最近命名色。
#
# EssentialsX 兼容：聊天/Tab 名字用玩家 displayName（保留 /nick 昵称）再强制 rank 色；
# 头顶名牌受计分板限制只能用真实名着色。若存在其它聊天格式化插件（如 EssentialsChat），
# 聊天颜色自动让位给该插件，rank 色仍体现在 Tab + 头顶名牌。
rank_colors:
  # 总开关：关闭后三处着色全部停用（Tab 名置空，恢复服务器原计分板队伍/vanilla 渲染，保留 team 前缀）
  enabled: true
  # 头顶名牌着色开关：关闭后仅聊天+Tab 着色（避让占用计分板队伍的其它插件时可关）
  nametag_enabled: true
  # Tab 列表着色开关：关闭后仅头顶+聊天着色（Tab 名置空，恢复服务器原计分板队伍/vanilla 渲染，保留 team 前缀）
  tab_enabled: false
  # OP 专用色（玩家 isOp 即显示此色，与等级组无关；优先级最高）
  op_color: "gold"
  # 四级权限组 → 命名色（非 OP 玩家按所属组显示）
  colors:
    admin: "red"
    builder: "green"
    member: "aqua"
    default: "gray"

# ==================================================
#          坐牢（作弊玩家，2026-09-02）
# ==================================================
# 作弊玩家强制进入独立 prison 组（完全独立于四级 track：不继承、不在晋升链），
# 仅保留 essentials.msg 私聊权限，其余全部禁用；重进仍保持 prison 并强制传回牢房。
prison:
  # 牢房传送坐标（world,x,y,z[,yaw,pitch]）；未配置/世界未加载时回退玩家当前世界出生点
  cell_location: "world,0,100,0,0,0"

# ==================================================
#          游戏模式矫正（权限组变化后，2026-08-29）
# ==================================================
# 玩家被降级后若当前游戏模式（创造/观察/冒险）已无对应权限，自动切回生存，
# 杜绝「普通玩家保留创造能力」的权限漏洞。三级触发：
#   审核通过 / 手动升降级 / LP 权限重算（覆盖手动 lp 命令）/ 登录兜底（覆盖离线期间被改组）。
# 矫正前先检查 Essentials 对应 gamemode 权限，有权限则不处理。
gamemode-correction:
  # 总开关：关闭后不做任何矫正
  enabled: true
  # 防抖窗口(ms)：同一玩家在该窗口内不重复矫正（LP 重算事件可能连发）
  debounce-ms: 2000
  # 观察模式玩家切生存前是否先处理安全位置（低于世界 minHeight+10 或脚下不安全
  # → 传送回床点/世界出生点，防虚空坠落/卡墙窒息）
  teleport-to-spawn-on-spectator-fix: true

# ==================================================
#              插件自更新（2026-09-03）
# ==================================================
# 插件在启用后异步查询 Hangar 项目通道最新版本；发现新版本时按下方策略自动下载到
# plugins/update/（Paper 重启时自动应用并删除旧 jar）。下载前按 Hangar 返回的
# sha256 校验，校验失败不落盘。全部网络/文件 IO 在异步线程执行，不阻塞服务器主线程。
update:
  # 自更新总开关：false 时启动/周期不再自动检查（/update check|now 仍可手动使用）
  enabled: true
  # 更新通道：release=正式版（推荐，稳定）| beta=开发版（-dev 构建）
  # 对应 CI 发布规则：tag → release 通道；main push → beta 通道
  channel: release
  # 自动检查间隔（小时）；0 = 仅启用时检查一次
  check_interval_hours: 12
  # 发现新版本后自动下载到 plugins/update/（下次重启生效）；
  # false = 仅控制台提示有新版 + 管理员执行 /update now 手动下载
  auto_download: false

