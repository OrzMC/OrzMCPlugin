# ==================================================
#              OrzMC 核心配置 (合并)
# ==================================================
config-version: 2

# ==================================================
#             服务器白名单配置
# ==================================================
whitelist:
  force_whitelist: true
  cleanup_inactive_days: 90
  pagination_delay_ticks: 5
  # 白名单踢出消息（当 force_whitelist=true 且玩家不在名单中时显示）
  kick_message:
    qq_group_id: ''
    title: "可以在这里提示用户关注UP主帐号，进行私域建设"
    ups:
      - platform: 'YouTube'
        name: 'OrzMC'
      - platform: 'BiliBili'
        name: 'OrzMC'

# ==================================================
#             地图优化/备份
# ==================================================
maintenance:
  optimize_enabled: false
  optimize_tick_time_threshold: 300
  backup_retention_count: 5
  backup_maintenance_motd: "服务器维护中，稍后再试"

# ==================================================
#                   TNT 检查配置
# ==================================================
tnt:
  enable: false
  enable_respawn_anchor: false
  place_cooldown: 5
  # TNT/爆炸告警聚合窗口(ms)：同一区域(128×128×64区块)同类型事件在窗口内合并为一条告警(带 ×N 和首个坐标)；
  # 既是突发合并也限制持续刷屏频率。单发事件仍立即发，不受窗口延迟。
  notify_aggregate_ms: 3000
  whitelist:
    - { minX: 0, maxX: 0, minY: 0, maxY: 0, minZ: 0, maxZ: 0, world: 'world' }
    - { minX: 0, maxX: 0, minY: 0, maxY: 0, minZ: 0, maxZ: 0, world: 'world_nether' }
    - { minX: 0, maxX: 0, minY: 0, maxY: 0, minZ: 0, maxZ: 0, world: 'world_the_end' }
  exempt_entities:
    - CREEPER
    - FIREBALL
    - BREEZE
    - WIND_CHARGE
    - BREEZE_WIND_CHARGE
    - ENDER_DRAGON
    - END_CRYSTAL
    - WITHER
    - WITHER_SKULL
    - SLIME
    - STRAY

# ==================================================
#                IP 地区白名单
# ==================================================
geoip:
  # 允许访问的地区国家码（空列表 = 不限制）
  # 填写大写两位 ISO 国家码，例如：
  #   allow_country_code: [CN, JP, TW]
  allow_country_code: []

# ==================================================
#             玩家上下线通知（2026-08-16）
# ==================================================
player_notify:
  # 各类型通知开关：关闭后该类型事件不再产生群消息
  enabled_join: true
  enabled_quit: true
  enabled_kick: true
  # 聚合窗口(ms)：窗口内所有上下线事件合并为一条消息，限制高频上下线刷屏。
  # 单条事件仍按原模板单发（延迟一个窗口），多条事件渲染 player_digest 摘要。
  # 消息频率被限制为最多 1 条/窗口，事件不丢失（逐条精确计数）。
  window_ms: 3000
  # 聚合摘要最多列出的玩家名数量，超出用 "+等N人" 截断（仅显示截断，计数不受影响）
  max_list_items: 6
  # 聚合摘要是否附带完整在线列表（单条事件模板始终含在线列表，不受此开关影响）
  include_online_list: false

# ==================================================
#              实体传送策略（2026-08-09）
# ==================================================
# 实体传送开关：true = 允许所有实体正常传送（默认，兼容原版行为，
# 如村民/动物过下界传送门）。false = 仅白名单内实体可传送：
#   - 白名单项：大写 EntityType 名（如 VILLAGER），或特殊键
#     TAMEABLE / ENDERMAN / ARMOR_STAND / SHULKER
entity_teleport_enabled: true
entity_teleport_whitelist:
  - TAMEABLE
  - ENDERMAN
  - ARMOR_STAND
  - SHULKER

# ==================================================
#              命令策略
# ==================================================
command_policies:
  tpbow:
    cooldown_secs: 3
    admin_only: false
  menu:
    cooldown_secs: 0
    admin_only: false
  portal:
    cooldown_secs: 5
    admin_only: true
