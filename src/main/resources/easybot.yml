# ===========================================================================
#          EasyBot IM Gateway Configuration
# ===========================================================================
# EasyBot 是一个统一的 IM 网关，支持 QQ / Telegram / Discord / 飞书 / 微信，
# 对外暴露统一的 REST API + WebSocket 事件推送。
#
# 全局开关已取消，插件自动检测是否有任一平台 enabled=true 来决定连接。
# ===========================================================================

# 配置 schema 版本：插件启动时若磁盘版本低于内置版本，会自动补齐缺失默认键并升级
# （原文件备份为 easybot.yml.bak）。版本号由插件维护，无需手动修改。
config-version: 11

# Bot 命令前缀
cmd_prompt_char: '$'

# 展示给玩家的社区入口（可选，不参与 EasyBot 消息路由）
discord_server_link: ''
qq_group_id: ''

# 日志限流周期
log_throttle_ms: 5000

# EasyBot API 服务端地址（REST API）
api_server: 'http://127.0.0.1:8080'

# EasyBot WebSocket 服务端地址（用于接收实时事件推送）
ws_server: 'ws://127.0.0.1:8080'

# API 密钥（REST 和 WebSocket 共用）
api_key: ''

# ===========================================================================
#  多平台设置
#  每个平台独立配置消息目标，默认全部关闭
#  需要启用哪个平台，就把对应 enabled 改为 true 并填入正确的 target
#  player_group 留空时 → PUBLIC 消息自动降级到 admin_group
#  扩展平台只需在此加配置段，零代码改动
# ===========================================================================
platforms:
  # ===== Discord =====
  discord:
    enabled: false
    # 管理会话 key（从 EasyBot 后台会话管理复制）
    admin_group: 'discord:conv_xxxxxxxx'
    # 玩家会话 key（留空则降级 admin_group）
    player_group: ''
    # 管理员私聊会话 key
    admin_dm: 'discord:conv_yyyyyyyy'

  # ===== Telegram =====
  telegram:
    enabled: false
    # 管理会话 key（从 EasyBot 后台会话管理复制）
    admin_group: 'telegram:conv_xxxxxxxx'
    # 玩家会话 key（留空则降级 admin_group）
    player_group: ''
    # 管理员私聊会话 key
    admin_dm: 'telegram:conv_yyyyyyyy'

  # ===== QQ =====
  qq:
    # 启用此平台（false 则不收不发）
    enabled: false
    # 管理会话 key（从 EasyBot 后台会话管理复制）
    admin_group: 'qq:conv_xxxxxxxx'
    # 玩家群 — PUBLIC 默认目标（留空则降级 admin_group）
    player_group: ''
    # 管理员私聊会话 key
    admin_dm: 'qq:conv_yyyyyyyy'

  # ===== 飞书 =====
  feishu:
    enabled: false
    # 管理会话 key（从 EasyBot 后台会话管理复制）
    admin_group: 'feishu:conv_xxxxxxxx'
    # 玩家群（留空则降级 admin_group）
    player_group: ''
    # 管理员私聊会话 key
    admin_dm: 'feishu:conv_yyyyyyyy'

  # ===== 微信（仅支持私聊 DM） =====
  wechat:
    enabled: false
    # 微信不支持群聊，admin_group 仅作为 PUBLIC 降级目标
    admin_group: 'wechat:conv_xxxxxxxx'
    # 微信无群聊概念，player_group 通常不填
    player_group: ''
    # 管理员私聊会话 key
    admin_dm: 'wechat:conv_yyyyyyyy'

# ===========================================================================
#  HTTP 超时与重试
# ===========================================================================
http_connect_timeout_seconds: 3
http_request_timeout_seconds: 3
http_max_retries: 3

# ===========================================================================
#  WebSocket 连接设置
#  EasyBot 使用 WebSocket PING/PONG 帧检测存活，无需应用层心跳
# ===========================================================================
ws_max_retries: 10
ws_base_retry_ms: 5000
ws_max_delay_ms: 60000
ws_jitter_percent: 10
ws_stable_reset_ms: 20000
ws_message_log_enabled: false
ws_message_log_throttle_ms: 60000
