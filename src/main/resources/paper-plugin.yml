# paper-plugin.yml: https://docs.papermc.io/paper/dev/paper-plugin-yml
name: OrzMC
version: 1.0.18
main: com.jokerhub.paper.plugin.orzmc.OrzMC
description: OrzMC for Paper Server Plugin
authors: [ wangzhizhou ]
contributors: [ wangzhizhou ]
website: https://orzmc.jokerhub.cn
api-version: '26.1.2'
folia-supported: false

# LuckPerms 软依赖（Paper 26 新格式）：确保 OrzMC 在 LP 之后加载，
# 且 LP 的类加载器对 OrzMC 可见（LP API 类由其插件提供）；LP 未安装时功能降级
dependencies:
  server:
    LuckPerms:
      required: false

# Paper 26.1 插件模式忽略 YAML 命令声明，命令通过 CommandBinder 使用 CommandMap API 注册。
# 此处只保留权限声明，供 Bukkit Permission 系统使用。
permissions:
  orzmc.admin:
    description: OrzMC 管理命令权限
    default: op
  orzmc.tpbow.use:
    description: 使用传送弓（射箭传送）的权限，默认放行
    default: true
