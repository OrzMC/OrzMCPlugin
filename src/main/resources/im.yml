# IM 网关配置（方案：docs/dev/im-gateway-inhouse.md）
#
# backend 选择 IM 消息通道：
#   easybot —— 外部 EasyBot 网关（默认，现状兜底；连接参数见 easybot.yml）
#   builtin —— 插件内置直连（QQ/飞书/Discord/Telegram；按 im-gateway-inhouse.md 逐平台落地，
#              当前未实现时选择 builtin 会停用群功能并在日志/告警中说明，不会自动回退）
#
# 会话绑定（admin_group / player_group / admin_dm）见 im_bindings.yml（由 /orzmc im bind 维护）。
backend: easybot

# 四平台网络代理——全局兜底（D13）：不配置本段 或 enabled: false → 直连；
#   平台级 platforms.<id>.proxy 可覆盖全局。用途：
#   - Telegram/Discord：国内服务器出墙必需（api.telegram.org / discord.com 国内不可达）；
#   - QQ/飞书：国内部署直连即可；海外部署（访问国内 QQ/飞书 API 不稳/被挡）可配代理回国。
# proxy:
#   enabled: false       # 是否启用代理（false/缺省 = 直连）
#   type: http           # 代理类型（默认 http）
#   host: ''             # 代理主机
#   port: 0              # 代理端口

# builtin 直连平台凭据（backend: builtin 且平台 enabled + 凭据齐备时启用；缺任一即该平台不可用）
platforms:
  qq:
    enabled: false
    app_id: ''
    client_secret: ''
    # proxy:              # 平台级代理覆盖（可省略 = 用全局 proxy 段）
    #   enabled: false
    #   host: ''
    #   port: 0
  feishu:
    enabled: false
    app_id: ''            # 飞书开放平台 App ID（cli_ 前缀）
    app_secret: ''        # 飞书开放平台 App Secret
    # proxy:              # 平台级代理覆盖（可省略 = 用全局 proxy 段）
    #   enabled: false
    #   host: ''
    #   port: 0
  telegram:
    enabled: false
    token: ''             # BotFather 下发的 bot token（<bot_id>:<auth>；长期有效，401=配置错误）
    # proxy:              # 平台级代理覆盖（可省略 = 用全局 proxy 段）
    #   enabled: false
    #   host: ''
    #   port: 0
  discord:
    enabled: false
    token: ''             # Discord 开发者门户 Bot Token（长期有效；鉴权失败=配置错误）
    # proxy:              # 平台级代理覆盖（可省略 = 用全局 proxy 段）
    #   enabled: false
    #   host: ''
    #   port: 0
