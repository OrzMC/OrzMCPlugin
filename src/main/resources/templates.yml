# ==================================================
#             配置消息模板
# ==================================================

# 模板 schema 版本：插件启动时若磁盘版本低于内置版本，会自动补齐缺失模板键并升级
# （原文件备份为 templates.yml.bak）。版本号由插件维护，无需手动修改。
config-version: 15

templates:
  format:
    tnt_alert: CODE_BLOCK
    exception_alert: PLAIN
    geoip_block: CODE_BLOCK
    geoip_unverifiable: CODE_BLOCK
    command_output: CODE_BLOCK
    command_help: CODE_BLOCK
    command_players: CODE_BLOCK
    command_whitelist_page: CODE_BLOCK
    command_whitelist_cleanup: CODE_BLOCK
    command_whitelist_add_result: PLAIN
    command_whitelist_remove_result: PLAIN
    command_blacklist_list: CODE_BLOCK
    command_blacklist_add: PLAIN
    command_blacklist_remove: PLAIN
    command_blacklist_error: PLAIN
    command_admin_required: PLAIN
    command_usage: PLAIN
    command_backup: PLAIN
    command_optimize: PLAIN
    command_optimize_disabled: PLAIN
    server_load: PLAIN
    server_stop: PLAIN
    whitelist_block: PLAIN
    whitelist_toggle_alert: PLAIN
    command_guard_blocked: PLAIN
    security_audit: PLAIN
    login_rate_limit_alert: PLAIN
    exploit_blocked: PLAIN
    ip_blacklist_block: PLAIN
    player_name_block: PLAIN
    maintenance_backup_stage: CODE_BLOCK
    maintenance_backup_done: CODE_BLOCK
    maintenance_backup_error: CODE_BLOCK
    maintenance_optimize_stage: CODE_BLOCK
    maintenance_optimize_done: CODE_BLOCK
    maintenance_optimize_error: CODE_BLOCK
    review_submitted: PLAIN
    review_cancelled: PLAIN
    review_approved: PLAIN
    review_rejected: PLAIN
    rank_promoted: PLAIN
    rank_demoted: PLAIN
    prison_imprisoned: PLAIN
    prison_released: PLAIN
    rank_status: CODE_BLOCK
    command_review_list: CODE_BLOCK
    command_review_list_empty: PLAIN
    command_review_result: PLAIN
    command_review_error: PLAIN
  command_output: "{message}"
  command_help: "{help}"
  # 列表类回复正文走语言包（bot.list.*，双语按平台语言渲染）；模板仅作 {message} 直通 + 格式载体。
  # 服主仍可覆盖正文：将 {message} 替换为自定义文本（占位符支持见 TemplatePlaceholderValidator）。
  command_players: "{message}"
  command_whitelist_header: "{message}"
  command_whitelist_page: "{message}"
  command_whitelist_cleanup: "{message}"
  command_whitelist_add_result: "{message}"
  command_whitelist_remove_result: "{message}"
  command_blacklist_list: "{patterns}"
  command_blacklist_add: "{message}"
  command_blacklist_remove: "{message}"
  command_blacklist_error: "{message}"
  command_admin_required: "{message}"
  command_usage: "{message}"
  command_backup: "{message}"
  command_optimize: "{message}"
  command_optimize_disabled: "{message}"
  rank_status: "{message}"
  command_review_list: "{message}"
  command_review_list_empty: "{message}"
  command_review_result: "{message}"
  command_review_error: "{message}"
  # ── 事件通知正文已迁入语言包 event.*（P4b，i18n R1 默认语言渲染）；模板仅保留格式（format）─
  # 存量盘正文/服主定制仍会被优先渲染（P4d 升级链统一迁移前保持 zh，不丢定制）。
  # 维护场景文案/进度行（maintenance_motd_*）与阶段名（stage_cn）已迁入语言包
  # maintenance.motd.* / maintenance.stage.*（P4c-2，默认语言 R1 渲染）；磁盘存量正文/定制仍被优先渲染
  # （MaintenanceTexts 磁盘优先→语言包回落，P4d 升级链统一迁移前保持 zh/不丢定制）。
  progress_units:
    rate: per_min
    eta: sec
  world_alias:
    world: 主世界
    world_nether: 下界
    world_the_end: 末地
  coord:
    scale: 1.0
    precision: 2
    unit_label: block

# ==================================================
#             文案配色
# ==================================================
styles:
  colors:
    success: "#00FF00"
    info: "#55AAFF"
    warn: "#FFAA00"
    error: "#FF5555"
    coord: "#55FF55"
    player: "#FF5555"
    unknown: "#AAAAAA"
    tnt_alert: "#FF5555"
    explosion_alert: "#FFAA00"
