# ==================================================
#             配置消息模板
# ==================================================
config-version: 2

templates:
  format:
    tnt_alert: CODE_BLOCK
    exception_alert: PLAIN
    geoip_block: CODE_BLOCK
    command_output: CODE_BLOCK
    command_help: CODE_BLOCK
    command_players: CODE_BLOCK
    command_whitelist_page: CODE_BLOCK
    command_whitelist_cleanup: CODE_BLOCK
    command_whitelist_add_result: PLAIN
    command_whitelist_remove_result: PLAIN
    command_blacklist_list: CODE_BLOCK
    command_blacklist_add: PLAIN
    command_blacklist_remove: PLAIN
    command_blacklist_error: PLAIN
    command_admin_required: PLAIN
    command_usage: PLAIN
    command_backup: PLAIN
    command_optimize: PLAIN
    command_optimize_disabled: PLAIN
    server_load: PLAIN
    server_stop: PLAIN
    whitelist_block: PLAIN
    whitelist_toggle_alert: PLAIN
    command_guard_blocked: PLAIN
    security_audit: PLAIN
    login_rate_limit_alert: PLAIN
    exploit_blocked: PLAIN
    ip_blacklist_block: PLAIN
    player_name_block: PLAIN
    maintenance_backup_stage: CODE_BLOCK
    maintenance_backup_done: CODE_BLOCK
    maintenance_backup_error: CODE_BLOCK
    maintenance_optimize_stage: CODE_BLOCK
    maintenance_optimize_done: CODE_BLOCK
    maintenance_optimize_error: CODE_BLOCK
    review_submitted: PLAIN
    review_cancelled: PLAIN
    review_approved: PLAIN
    review_rejected: PLAIN
    rank_promoted: PLAIN
    rank_demoted: PLAIN
    rank_status: CODE_BLOCK
    command_review_list: CODE_BLOCK
    command_review_list_empty: PLAIN
    command_review_result: PLAIN
    command_review_error: PLAIN
  command_output: "{message}"
  command_help: "{help}"
  command_players: "------当前在线({online_count}/{max_count})------\n{online_list}"
  command_whitelist_header: "------当前白名单玩家({count})------"
  command_whitelist_page: "{header}\n第{page}/{total}页\n{body}"
  command_whitelist_cleanup: "------白名单清理------\n{removed_list}"
  command_whitelist_add_result: "{message}"
  command_whitelist_remove_result: "{message}"
  command_blacklist_list: "{patterns}"
  command_blacklist_add: "{message}"
  command_blacklist_remove: "{message}"
  command_blacklist_error: "{message}"
  command_admin_required: "{message}"
  command_usage: "{message}"
  command_backup: "{message}"
  command_optimize: "{message}"
  command_optimize_disabled: "{message}"
  review_submitted: "🙋🏻‍♂️ [申请发起] {player}\n---------------------------------\n{summary}"
  review_cancelled: "↩️ [申请撤回] {player}\n---------------------------------\n{summary}"
  review_approved: "✅ [申请通过] {player}\n---------------------------------\n{summary}\n---------------------------------\n审核人：{reviewer}"
  review_rejected: "❌ [申请拒绝] {player}\n---------------------------------\n{summary}\n---------------------------------\n审核人：{reviewer}"
  rank_promoted: "🎉 {player} 权限已升级为「{group}」"
  rank_demoted: "⬇️ {player} 权限已被降级为「{group}」"
  rank_status: "{message}"
  command_review_list: "{message}"
  command_review_list_empty: "当前没有待审核的申请。"
  command_review_result: "{message}"
  command_review_error: "{message}"
  server_load: "{message}"
  server_stop: "{message}"
  whitelist_block: "🙅🏻‍♂️ {message}"
  whitelist_toggle_alert: "⚠️ 服务器异常\n---------------------------------\n{message}"
  command_guard_blocked: "⚠ 高危命令已被拦截\n命令: {command}\n来源: {source} | 发送者: {sender}\n原因: {reason}"
  security_audit: "🛡 安全自检报告\n在线模式: {online_mode}\n命令方块: {command_block}\nRCON: {rcon}\n白名单: {whitelist}\nOP: {ops}\n关键插件: {plugins}"
  login_rate_limit_alert: "⚠ 登录限流\nIP: {ip}\n玩家: {player}\n原因: {reason}"
  exploit_blocked: "⚠ 漏洞利用拦截\n玩家: {player}\n原因: {reason}"
  ip_blacklist_block: "⚠ IP 黑名单拦截\n玩家: {player}\nIP: {ip}\n命中规则: {pattern}"
  player_name_block: "⚠ 玩家名规则拦截\n玩家: {player}\n命中规则: {rule}"
  player_join: "🎮 当前玩家({online_count}/{max_count})\n---------------------------------\n🥰 上线：\n{name}"
  player_quit: "🎮 当前玩家({online_count}/{max_count})\n---------------------------------\n😋 下线：\n{name}"
  player_kick: "🎮 当前玩家({online_count}/{max_count})\n---------------------------------\n😂 被踢：\n{name}"
  player_digest: "🎮 当前玩家({online_count}/{max_count})\n{join_summary}{quit_summary}{kick_summary}"
  # 群消息不再附堆栈摘要（{stack_summary} 仍保留在白名单供自定义模板使用）
  exception_alert: "⚠️ 服务器异常\n---------------------------------\n{message}"
  geoip_block: "{name}({ip}) 地区:{country_code} 不在允许列表({allow_list})\n{address_info}"
  tnt_alert: "{msg}\n世界:{world_alias} 坐标:{x_unit},{y_unit},{z_unit}({coord_unit})\n触发:{actor} 方块:{block_type}"
  maintenance_backup_stage: "地图{label} 阶段:{stage}({stage_name}/{stage_i18n}) 进度:{percent}% {current}/{total} 速率:{rate_per}{rate_unit} 预计剩余:{eta_value}{eta_unit}"
  maintenance_backup_done: "地图{label} 完成 用时:{duration_human}"
  maintenance_backup_error: "地图{label} 失败 用时:{duration_human}"
  maintenance_optimize_stage: "地图{label} 阶段:{stage}({stage_name}/{stage_i18n}) 进度:{percent}% {current}/{total} 速率:{rate_per}{rate_unit} 预计剩余:{eta_value}{eta_unit}"
  maintenance_optimize_done: "地图{label} 完成 用时:{duration_human}"
  maintenance_optimize_error: "地图{label} 失败 用时:{duration_human}"
  stage_cn:
    Region: 区域
    Chunk: 区块
    File: 文件
    Done: 完成
  progress_units:
    rate: per_min
    eta: sec
  world_alias:
    world: 主世界
    world_nether: 下界
    world_the_end: 末地
  locale: zh-CN
  i18n:
    command:
      en-US:
        command_output: "{message}"
        command_help: "{help}"
        command_players: "------Online ({online_count}/{max_count})------\n{online_list}"
        command_whitelist_header: "------Whitelist ({count})------"
        command_whitelist_page: "{header}\nPage {page}/{total}\n{body}"
        command_whitelist_cleanup: "------Whitelist Cleanup------\n{removed_list}"
        command_whitelist_add_result: "{message}"
        command_whitelist_remove_result: "{message}"
        command_blacklist_list: "{patterns}"
        command_blacklist_add: "{message}"
        command_blacklist_remove: "{message}"
        command_blacklist_error: "{message}"
        command_admin_required: "{message}"
        command_usage: "{message}"
        command_backup: "{message}"
        command_optimize: "{message}"
        command_optimize_disabled: "{message}"
    world_alias:
      zh-CN:
        world: 主世界
        world_nether: 下界
        world_the_end: 末地
    stage_alias:
      zh-CN:
        Region: 区域
        Chunk: 区块
        File: 文件
        Done: 完成
  coord:
    scale: 1.0
    precision: 2
    unit_label: block

# ==================================================
#             文案配色
# ==================================================
styles:
  colors:
    success: "#00FF00"
    info: "#55AAFF"
    warn: "#FFAA00"
    error: "#FF5555"
    coord: "#55FF55"
    player: "#FF5555"
    unknown: "#AAAAAA"
    tnt_alert: "#FF5555"
    explosion_alert: "#FFAA00"
